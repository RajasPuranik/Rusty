[package]
name = "rusty_browser"
version = "0.2.0"
edition = "2021"
description = "A minimal, memory-efficient desktop web browser built with Rust + wry"
license = "MIT OR Apache-2.0"

[dependencies]
# Windowing (cross-platform, maintained by Tauri team)
tao = "0.37"

# System webview wrapper (WebView2 on Windows, WebKit on macOS, WebKitGTK on Linux)
wry = "0.57"

# URL parsing & validation
url = "2"

# Percent-encoding for search queries
percent-encoding = "2"

# Error handling
anyhow = "1"

# JSON serialization for IPC between toolbar webview and Rust backend
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging & timing spans (Split View / UI thread diagnostics)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }


[package.metadata.deb]
maintainer = "Rusty Browser Maintainers <dev@rusty.app>"
copyright = "2026 Rusty Browser Contributors"
license-file = ["LICENSE", "4"]
extended-description = "A minimal, memory-efficient desktop web browser built with Rust + wry and WebKitGTK"
section = "web"
priority = "optional"
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1"
assets = [
    ["target/release/rusty_browser", "usr/bin/rusty_browser", "755"],
    ["assets/rusty_browser.desktop", "usr/share/applications/rusty_browser.desktop", "644"],
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
