    <filter id="r-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f97316" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Stylized modern R glyph -->
  <path d="M14 52L24 14H42C48.6 14 53 18.2 51.5 24.5C50.2 30 45.5 34 39.5 34.5H29L26 46H16L17.5 40H27.5L29 34H38C42 34 44.8 31 45.6 27.5C46.4 24 44.5 20 40 20H28L20 52H14Z" fill="url(#r-white-grad)"/>
