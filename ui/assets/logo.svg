<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--surface, #1e293b)"/>
      <stop offset="100%" stop-color="var(--surface-2, #0f172a)"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--accent, #3b82f6)"/>
      <stop offset="100%" stop-color="var(--accent-2, #60a5fa)"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- 3D Soft Rounded Tile -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#tile-grad)" stroke="var(--border, rgba(255,255,255,0.15))" stroke-width="1.5" filter="url(#tile-shadow)"/>
  <!-- Stylized modern R glyph -->
  <path d="M18 46L26 18H38C43.5 18 47 21.5 46 26.5C45 31 41.5 34 36.5 34.5H29L27 42H20L21 37H28L29 32H35C38.5 32 40.5 29.5 41 27C41.5 24 39.5 21 36 21H28L22 46H18Z" fill="var(--text, #ffffff)"/>
  <!-- Glowing accent diagonal kick -->
  <path d="M31 34L41 46H50L39 34H31Z" fill="url(#accent-grad)"/>
</svg>
