<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <!-- Base layout, Themes, and NTP Styling -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/newtab.css">

  <!-- Early boot loader -->
  <script src="js/boot.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/engines.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/fx-registry.js"></script>
</head>
<body class="ntp-body">
  <!-- Interactive constellation canvas for Crazy skin -->
  <canvas id="ntp-canvas"></canvas>

  <div class="ntp-shell">
    <!-- ── Left Rail: Navigation Dock & Workspaces ──────────────────── -->
    <aside class="ntp-left-rail">
      <!-- Icon dock -->
      <nav class="dock-icons">
        <button class="dock-btn active" id="dock-btn-home" title="Focus Search (/)"><script>document.write(window.Icons.get('home', '', 18));</script></button>
        <button class="dock-btn" id="dock-btn-apps" title="Command Palette (Ctrl+K)"><script>document.write(window.Icons.get('command', '', 18));</script></button>
        <button class="dock-btn" id="dock-btn-spaces" title="Toggle Vertical Tabs (Ctrl+Shift+V)"><script>document.write(window.Icons.get('vertical-tabs', '', 18));</script></button>
        <button class="dock-btn ai-badge" id="dock-btn-ai" title="Search / AI Prompt"><script>document.write(window.Icons.get('sparkles', '', 18));</script></button>
        <button class="dock-btn" id="dock-btn-bookmarks" title="Bookmarks Panel"><script>document.write(window.Icons.get('bookmark', '', 18));</script></button>
        <button class="dock-btn" id="dock-btn-history" title="History Panel (Ctrl+H)"><script>document.write(window.Icons.get('history', '', 18));</script></button>
        <button class="dock-btn" id="dock-btn-downloads" title="Downloads Panel (Ctrl+J)"><script>document.write(window.Icons.get('download', '', 18));</script></button>
        <button class="dock-btn" id="dock-btn-settings" title="Settings (Ctrl+,)"><script>document.write(window.Icons.get('settings', '', 18));</script></button>
      </nav>

      <!-- Workspaces List -->
      <div class="workspaces-section">
        <div class="workspaces-header">
          <span class="workspaces-title">Workspaces</span>
          <button class="btn-icon-xs" id="btn-add-workspace" title="Add Workspace"><script>document.write(window.Icons.get('plus', '', 12));</script></button>
        </div>
        <div class="workspaces-list" id="workspaces-list">
          <button class="workspace-chip active" data-ws="main"><script>document.write(window.Icons.get('home', '', 14));</script><span>Main</span></button>
          <button class="workspace-chip" data-ws="college"><script>document.write(window.Icons.get('folder', '', 14));</script><span>College</span></button>
          <button class="workspace-chip" data-ws="projects"><span>&lt;/&gt; Projects</span></button>
          <button class="workspace-chip" data-ws="media"><script>document.write(window.Icons.get('play', '', 12));</script><span>Media</span></button>
          <button class="workspace-chip" data-ws="games"><script>document.write(window.Icons.get('gamepad', '', 14));</script><span>Games</span></button>
        </div>
      </div>

      <!-- Companion Pet Slot at bottom of Left Rail (Crazy skin only; hidden in Minimal) -->
      <div class="planet-decoration pet-rail-slot" id="left-rail-bottom-slot"></div>
    </aside>

    <!-- ── Center Stage: Hero, Search, Dials, & Feature Cards ──────── -->
    <main class="ntp-center">
      <!-- Hero Brand -->
      <header class="brand-hero" id="brand-hero">
        <div class="brand-logo-wrap">
          <img src="assets/logo.svg" alt="Rusty Browser" class="brand-logo-img">
          <h1 class="brand-title">Rusty Browser</h1>
        </div>
        <p class="brand-tagline">Browse • Create • Focus • Automate</p>
      </header>

      <!-- Central Search Bar (Crisp Engine-Colored Mask Outline) -->
      <section class="search-section">
        <div class="search-box engine-outline-box" id="search-box">
          <span class="search-icon"><script>document.write(window.Icons.get('search', '', 18));</script></span>
          <input id="search-input" class="search-input" type="text" placeholder="Search the web or enter a URL..." autocomplete="off" spellcheck="false" autofocus>
          <button class="btn-ai-sparkle" id="btn-search-ai" title="Search Prompt"><script>document.write(window.Icons.get('sparkles', '', 16));</script></button>
          <span class="search-key-badge">/</span>
        </div>

        <!-- Search Engine Chips (Populated dynamically from RustyEngines table) -->
        <div id="engine-chips" class="engine-chips"></div>

        <!-- Inline Add Custom Search Engine Form -->
        <form id="ntp-custom-engine-form" class="ntp-custom-engine-form" hidden>
          <input id="ntp-engine-name" class="weather-city-input" type="text" placeholder="Name (e.g. Kagi)" maxlength="32" required>
          <input id="ntp-engine-template" class="weather-city-input" type="text" placeholder="URL with %s (https://...?q=%s)" required>
          <input id="ntp-engine-color" type="color" class="engine-color-picker" title="Outline color" value="#f97316">
          <button type="submit" class="weather-city-save">Add</button>
          <button type="button" id="ntp-engine-cancel" class="btn-icon-xs" title="Cancel"><script>document.write(window.Icons.get('close', '', 12));</script></button>
        </form>
      </section>

      <!-- Speed Dial Pill Row -->
      <section class="speed-dial-section" id="speed-dial-section">
        <div id="speed-dial-grid" class="speed-dial-row"></div>
      </section>

      <!-- Bottom Quick-Access Launch Cards (Customizable: 3 to 6 cards) -->
      <section class="launch-cards-section">
        <div class="launch-cards-header">
          <span class="launch-cards-title">Launch Cards</span>
          <div class="launch-cards-actions">
            <button type="button" class="btn-icon-xs" id="btn-add-launch-card" title="Add Card (3 to 6)"><script>document.write(window.Icons.get('plus', '', 12));</script></button>
            <button type="button" class="btn-icon-xs" id="btn-export-launch-cards" title="Export Cards JSON"><script>document.write(window.Icons.get('download', '', 12));</script></button>
            <button type="button" class="btn-icon-xs" id="btn-import-launch-cards" title="Import Cards JSON"><script>document.write(window.Icons.get('upload', '', 12));</script></button>
            <input type="file" id="import-cards-file" accept=".json" style="display: none;">
          </div>
        </div>
        <div id="launch-cards-grid" class="action-cards-grid">
          <!-- Rendered dynamically by newtab.js -->
        </div>
      </section>
    </main>

    <!-- ── Right Rail: Widgets Dashboard ───────────────────────────── -->
    <aside class="ntp-right-rail">
      <!-- Merged Time & Weather Card (A1 + A2 Globe) -->
      <div class="widget-card widget-time-weather-card" id="widget-time-weather" title="Tap to expand 5-day forecast &amp; world clocks">
        <div class="tw-compact-row" id="tw-compact-row">
          <div class="tw-left-col">
            <div class="tw-clock-block" id="tw-clock-block">
              <div id="clock-time" class="clock-time">--:-- <span class="clock-ampm">--</span></div>
              <div id="clock-date" class="clock-date">Loading date...</div>
            </div>

            <div class="tw-weather-block" id="tw-weather-block">
              <div class="tw-weather-main">
                <span class="weather-icon-wrap" id="weather-icon"><script>document.write(window.Icons.get('weather', '', 18));</script></span>
                <span class="weather-temp" id="weather-temp">--°C</span>
                <span class="weather-condition" id="weather-condition">Offline</span>
                <span class="tw-offline-badge" id="weather-offline-badge" hidden>Offline</span>
              </div>
              <div class="tw-weather-sub">
                <div class="tw-weather-details">
                  <div class="weather-location" id="weather-location">Detecting timezone...</div>
                  <div class="weather-meta" id="weather-meta"></div>
                </div>
                <div class="weather-actions">
                  <button class="btn-icon-xs" id="btn-weather-refresh" type="button" title="Refresh weather"><script>document.write(window.Icons.get('reload', '', 12));</script></button>
                  <button class="btn-icon-xs tw-expand-btn" id="tw-expand-btn" type="button" title="Expand 5-day forecast &amp; world clocks"><script>document.write(window.Icons.get('chevron-down', '', 12));</script></button>
                </div>
              </div>
            </div>
          </div>

          <div class="globe-slot" id="globe-slot" title="Drag to spin • Double-click to re-center">
            <img class="globe-fallback-img" id="globe-fallback-img" src="assets/earth-fallback.webp" alt="Earth">
          </div>
        </div>

        <div class="tw-expanded" id="tw-expanded" hidden>
          <div class="tw-forecast-section" id="tw-forecast-section">
            <div class="tw-section-label">5-Day Forecast</div>
            <div class="tw-forecast-row" id="weather-forecast-row"></div>
          </div>

          <div class="tw-worldclock-section" id="tw-worldclock-section">
            <div class="tw-section-header">
              <span class="tw-section-label">World Clocks</span>
              <button type="button" class="btn-link-xs" id="btn-toggle-worldclock-add">+ Add city</button>
            </div>
            <div class="world-clock-row" id="world-clock-list"></div>
            <form class="world-clock-form" id="world-clock-form" hidden>
              <select id="world-clock-select" class="weather-city-input"></select>
              <button type="submit" class="weather-city-save">Add</button>
            </form>
          </div>

          <form class="weather-city-form" id="weather-city-form">
            <input id="weather-city-input" class="weather-city-input" type="text" placeholder="City name (blank = timezone)..." autocomplete="off" spellcheck="false">
            <button type="submit" class="weather-city-save">Set</button>
            <button type="button" class="weather-loc-btn" id="btn-use-my-location" title="Use browser geolocation for weather &amp; globe pin">Use my location</button>
          </form>

          <label class="tw-clouds-toggle">
            <input type="checkbox" id="toggle-globe-clouds">
            <span>Cloud layer</span>
          </label>
        </div>
      </div>

      <!-- Quick Notes Checklist Card -->
      <div class="widget-card widget-notes-card" id="widget-notes">
        <div class="widget-header">
          <div class="widget-title-wrap">
            <span class="widget-icon text-orange"><script>document.write(window.Icons.get('pencil', '', 14));</script></span>
            <span class="widget-title">Quick Notes</span>
          </div>
          <button class="btn-icon-xs" id="btn-add-note" title="Add Note Item"><script>document.write(window.Icons.get('plus', '', 12));</script></button>
        </div>
        <div class="notes-checklist" id="notes-checklist">
          <!-- Populated by JS -->
        </div>
        <textarea id="scratchpad" class="scratchpad-area" placeholder="Or type freeform scratchpad notes here..."></textarea>
      </div>

      <!-- Focus / Pomodoro Timer Card -->
      <div class="widget-card widget-focus-card" id="widget-focus">
        <div class="widget-header">
          <div class="widget-title-wrap">
            <span class="widget-icon text-orange"><script>document.write(window.Icons.get('target', '', 14));</script></span>
            <span class="widget-title">Focus</span>
          </div>
          <button class="btn-icon-xs" id="btn-focus-settings" title="Reset Timer"><script>document.write(window.Icons.get('reload', '', 12));</script></button>
        </div>
        <div class="focus-modes">
          <button class="focus-mode-btn active" data-mode="study"><script>document.write(window.Icons.get('pencil', '', 12));</script><span>Study</span></button>
          <button class="focus-mode-btn" data-mode="work"><script>document.write(window.Icons.get('briefcase', '', 12));</script><span>Work</span></button>
          <button class="focus-mode-btn" data-mode="deep"><script>document.write(window.Icons.get('sparkles', '', 12));</script><span>Deep</span></button>
        </div>
        <div class="focus-timer-row">
          <div class="focus-time-display" id="focus-time-display">25:00</div>
          <button class="btn-focus-play" id="btn-focus-play" title="Start/Pause Timer"><script>document.write(window.Icons.get('play', '', 14));</script></button>
        </div>
      </div>

      <!-- System Monitor Card (Live OS Telemetry from Rust) -->
      <div class="widget-card widget-monitor-card" id="widget-monitor">
        <div class="widget-header">
          <div class="widget-title-wrap">
            <span class="widget-icon text-orange"><script>document.write(window.Icons.get('activity', '', 14));</script></span>
            <span class="widget-title">System Monitor</span>
          </div>
          <span class="chevron-xs" title="Real Windows OS Telemetry"><script>document.write(window.Icons.get('cpu', '', 12));</script></span>
        </div>
        <div class="monitor-metrics">
          <div class="monitor-row">
            <span class="monitor-label">CPU</span>
            <svg class="sparkline-svg" viewBox="0 0 100 20" id="cpu-sparkline">
              <path id="cpu-spark-path" d="M0,18 L100,18" fill="none" stroke="var(--accent-secondary)" stroke-width="1.8"/>
            </svg>
            <span class="monitor-value" id="cpu-val">--%</span>
          </div>
          <div class="monitor-row">
            <span class="monitor-label">RAM</span>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" id="ram-fill" style="width: 0%;"></div>
            </div>
            <span class="monitor-value" id="ram-val">--%</span>
          </div>
          <div class="monitor-row">
            <span class="monitor-label">GPU</span>
            <svg class="sparkline-svg" viewBox="0 0 100 20" id="gpu-sparkline">
              <path id="gpu-spark-path" d="M0,18 L100,18" fill="none" stroke="var(--accent-primary)" stroke-width="1.8"/>
            </svg>
            <span class="monitor-value" id="gpu-val">--%</span>
          </div>
          <div class="monitor-subrow">
            <span id="monitor-app-mem">App -- MB</span>
            <span id="monitor-net-speed">Net --</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Launch Card Edit Modal -->
  <div id="card-edit-modal-backdrop" class="modal-backdrop" style="display: none;">
    <div class="card-edit-modal">
      <div class="modal-header">
        <span id="modal-card-title-text" class="modal-title">Edit Launch Card</span>
        <button type="button" class="btn-icon-xs" id="btn-close-card-modal"><script>document.write(window.Icons.get('close', '', 14));</script></button>
      </div>
      <form id="card-edit-form" class="card-edit-form">
        <input type="hidden" id="edit-card-id">
        <div class="form-group">
          <label for="edit-card-title">Title</label>
          <input type="text" id="edit-card-title" required maxlength="28" class="form-input">
        </div>
        <div class="form-group">
          <label for="edit-card-subtitle">Subtitle</label>
          <input type="text" id="edit-card-subtitle" maxlength="48" class="form-input">
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="edit-card-type">Card Type</label>
            <select id="edit-card-type" class="form-select">
              <option value="app">App Launcher (Local Desktop App)</option>
              <option value="web">Web Shortcut (URL)</option>
              <option value="action">Quick Action (Browser Action)</option>
              <option value="widget">Mini Widget (Live Stat)</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="edit-card-icon">Icon</label>
            <select id="edit-card-icon" class="form-select">
              <option value="command">Terminal / Command</option>
              <option value="sparkles">Sparkles / AI</option>
              <option value="search">Search</option>
              <option value="target">Target / Focus</option>
              <option value="layers">Layers / Tabs</option>
              <option value="play">Media / Play</option>
              <option value="download">Downloads</option>
              <option value="settings">Settings</option>
              <option value="cpu">CPU / Monitor</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="edit-card-target" id="edit-card-target-label">Target</label>
          <input type="text" id="edit-card-target" required class="form-input" placeholder="e.g. terminal, https://..., tabs_count">
        </div>
        <div class="form-group">
          <label for="edit-card-color">Accent Color</label>
          <input type="color" id="edit-card-color" value="#f97316" class="form-color">
        </div>
        <div class="modal-footer">
          <button type="button" id="btn-delete-card" class="btn-danger-xs">Delete</button>
          <div class="modal-footer-right">
            <button type="button" id="btn-cancel-card" class="btn-secondary-xs">Cancel</button>
            <button type="submit" class="btn-primary-xs">Save Card</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="js/globe.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
